<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Retail Demand Forecast</title><link rel="stylesheet" href="/static/styles.css"><script src="https://cdn.jsdelivr.net/npm/chart.js"></script></head><body><div class="wrap"><header><div><p>FORECASTING + INVENTORY SIGNALS</p><h1>Retail Demand Command Center</h1><span>Time-aware ML forecasting with recursive multi-day inference.</span></div></header><section class="controls"><label>Store<select id="store"><option>1</option><option>2</option><option>3</option></select></label><label>Product<select id="product"><option>1</option><option>2</option><option>3</option><option>4</option></select></label><label>Horizon<select id="horizon"><option>7</option><option selected>14</option><option>30</option></select></label><label>Promotion<select id="promo"><option value="0">No</option><option value="1">Yes</option></select></label><button id="run">Generate forecast</button></section><section class="grid"><div class="card chart"><canvas id="chart"></canvas></div><div class="card"><p class="kicker">NEXT 14 DAYS</p><div id="total" class="metric">--</div><p>forecast units</p><hr><p id="info">Choose a store/product and run the forecast.</p></div></section></div><script src="/static/app.js"></script></body></html>
